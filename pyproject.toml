[project]
name = "openldap-opencensus-stats"
dynamic = ["version"]
description = "OpenLDAP OpenCensus Statistics"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "InkBridge Networks", email = "support@inkbridge.io" },
]
keywords = ["openldap", "opencensus", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration :: Authentication/Directory :: LDAP",
]
dependencies = [
    "opencensus-ext-prometheus",
    "opencensus>=0.11.4",
    "prometheus-client",
    "python-ldap",
    "pyyaml",
    "watchfiles",
]

[project.optional-dependencies]
# grpcio (opencensus-ext-stackdriver's own dependency) is optional;
# deployments that only use the Prometheus exporter don't need it.
# pip install openldap-opencensus-stats[stackdriver] pulls this in
# for anyone who does need the Stackdriver exporter.
stackdriver = [
    "grpcio>=1.47.0",
    "opencensus-ext-stackdriver==0.8.0",
]

[project.scripts]
openldap_opencensus_stats = "openldap_opencensus_stats.main:monitor"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "openldap_opencensus_stats/**",
    "README.md",
    "openldap-opencensus-stats.template.yml",
]

[tool.hatch.build.targets.wheel]
packages = ["openldap_opencensus_stats"]

[tool.hatch.build.targets.wheel.shared-data]
"openldap-opencensus-stats.template.yml" = "etc/openldap-opencensus-stats.template.yml"
